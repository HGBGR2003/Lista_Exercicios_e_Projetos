<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ride Request</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    @layer tailwind-base, tailwind-components, tailwind-utilities, overrides;
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="min-h-[100dvh] w-full max-w-[calc(100dvh*9/16)] mx-auto px-[10px] pt-[14px] bg-white rounded-[20px] overflow-auto">

  <header class="flex justify-between items-center mb-[14px]">
    <div>
      <svg class="w-5 fill-[#3d3a7a]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
        <path d="M0 96C0 78.3 14.3 64 32 64l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 128C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32l384 0c17.7 0 32 14.3 32 32s-14.3 32-32 32L32 288c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32L32 448c-17.7 0-32-14.3-32-32s14.3-32 32-32l384 0c17.7 0 32 14.3 32 32z" />
      </svg>
    </div>
    <div class="relative inline-flex items-center justify-center">
      <svg class="w-5 fill-[#3d3a7a]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
        <path d="M224 0c-13.3 0-24 10.7-24 24l0 9.7C118.6 45.3 56 115.4 56 200l0 14.5c0 37.7-10 74.7-29 107.3L5.1 359.2C1.8 365 0 371.5 0 378.2 0 399.1 16.9 416 37.8 416l372.4 0c20.9 0 37.8-16.9 37.8-37.8 0-6.7-1.8-13.3-5.1-19L421 321.7c-19-32.6-29-69.6-29-107.3l0-14.5c0-84.6-62.6-154.7-144-166.3l0-9.7c0-13.3-10.7-24-24-24zM392.4 368l-336.9 0 12.9-22.1C91.7 306 104 260.6 104 214.5l0-14.5c0-66.3 53.7-120 120-120s120 53.7 120 120l0 14.5c0 46.2 12.3 91.5 35.5 131.4L392.4 368zM156.1 464c9.9 28 36.6 48 67.9 48s58-20 67.9-48l-135.8 0z" />
      </svg>
      <span class="absolute -top-1.5 -right-2 w-4 h-4 rounded-full bg-[#eb5b95] text-white text-[10px] font-black grid place-items-center leading-none">1</span>
    </div>
  </header>

  <main>
    <section class="grid grid-cols-[114px_1fr] gap-3 items-center mb-4">
      <img src="images/nice-guy.png" alt="Um cara com camisa rosa." class="w-[114px] h-[144px] object-cover rounded-[10px]" />
      <div>
        <h1 class="text-[18px] font-extrabold leading-tight text-[#343172] mb-1">Daniel Quite</h1>
        <p class="font-bold text-[13px] text-[#7a7894] mb-1">+29 0278 3850</p>
        <p class="text-[12px] font-semibold text-[#cecdd4]">Driver</p>
      </div>
    </section>

    <nav class="top-actions grid grid-cols-4 gap-[10px]" role="tablist" aria-label="Main navigation">

      <button type="button" class="icon-main active h-[88px] rounded-[14px] shadow-[0_8px_18px_rgba(40,35,89,0.08)] mb-4
               flex flex-col items-center justify-center gap-2 cursor-pointer border-none w-full"
        data-tab="ride" role="tab" aria-selected="true">
        <svg class="w-[17px]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
          <path d="M135.2 117.4l-26.1 74.6 293.8 0-26.1-74.6C372.3 104.6 360.2 96 346.6 96L165.4 96c-13.6 0-25.7 8.6-30.2 21.4zM39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32l181.2 0c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2l0 192c0 17.7-14.3 32-32 32l-32 0c-17.7 0-32-14.3-32-32l0-32-320 0 0 32c0 17.7-14.3 32-32 32l-32 0c-17.7 0-32-14.3-32-32L0 256c0-26.7 16.4-49.6 39.6-59.2zM128 304a32 32 0 1 0 -64 0 32 32 0 1 0 64 0zm288 32a32 32 0 1 0 0-64 32 32 0 1 0 0 64z" />
        </svg>
        <span class="text-[11px] font-semibold">Ride</span>
      </button>

      <button type="button" class="icon-main h-[88px] rounded-[14px] shadow-[0_8px_18px_rgba(40,35,89,0.08)] mb-4
               flex flex-col items-center justify-center gap-2 cursor-pointer border-none w-full"
        data-tab="message" role="tab" aria-selected="false">
        <svg class="w-[17px]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
          <path d="M48 64c-26.5 0-48 21.5-48 48 0 15.1 7.1 29.3 19.2 38.4l208 156c17.1 12.8 40.5 12.8 57.6 0l208-156c12.1-9.1 19.2-23.3 19.2-38.4 0-26.5-21.5-48-48-48L48 64zM0 196L0 384c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-188-198.4 148.8c-34.1 25.6-81.1 25.6-115.2 0L0 196z" />
        </svg>
        <span class="text-[11px] font-semibold">Message</span>
      </button>

      <button type="button" class="icon-main h-[88px] rounded-[14px] shadow-[0_8px_18px_rgba(40,35,89,0.08)] mb-4
               flex flex-col items-center justify-center gap-2 cursor-pointer border-none w-full"
        data-tab="rating" role="tab" aria-selected="false">
        <svg class="w-[17px]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
          <path d="M378.9 80c-27.3 0-53 13.1-69 35.2l-34.4 47.6c-4.5 6.2-11.7 9.9-19.4 9.9s-14.9-3.7-19.4-9.9l-34.4-47.6c-16-22.1-41.7-35.2-69-35.2-47 0-85.1 38.1-85.1 85.1 0 49.9 32 98.4 68.1 142.3 41.1 50 91.4 94 125.9 120.3 3.2 2.4 7.9 4.2 14 4.2s10.8-1.8 14-4.2c34.5-26.3 84.8-70.4 125.9-120.3 36.2-43.9 68.1-92.4 68.1-142.3 0-47-38.1-85.1-85.1-85.1zM271 87.1c25-34.6 65.2-55.1 107.9-55.1 73.5 0 133.1 59.6 133.1 133.1 0 68.6-42.9 128.9-79.1 172.8-44.1 53.6-97.3 100.1-133.8 127.9-12.3 9.4-27.5 14.1-43.1 14.1s-30.8-4.7-43.1-14.1C176.4 438 123.2 391.5 79.1 338 42.9 294.1 0 233.7 0 165.1 0 91.6 59.6 32 133.1 32 175.8 32 216 52.5 241 87.1l15 20.7 15-20.7z" />
        </svg>
        <span class="text-[11px] font-semibold">Rating</span>
      </button>

      <button type="button" class="icon-main h-[88px] rounded-[14px] shadow-[0_8px_18px_rgba(40,35,89,0.08)] mb-4
               flex flex-col items-center justify-center gap-2 cursor-pointer border-none w-full"
        data-tab="feed" role="tab" aria-selected="false">
        <svg class="w-[17px]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
          <path d="M64 96c0-17.7 14.3-32 32-32l160 0c17.7 0 32 14.3 32 32l0 288 96 0 0-128c0-17.7 14.3-32 32-32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-32 0 0 128c0 17.7-14.3 32-32 32l-160 0c-17.7 0-32-14.3-32-32l0-288-96 0 0 128c0 17.7-14.3 32-32 32l-64 0c-17.7 0-32-14.3-32-32s14.3-32 32-32l32 0 0-128z" />
        </svg>
        <span class="text-[11px] font-semibold">My Feed</span>
      </button>

    </nav>

    <div id="ride-panel" class="w-full mb-4 flex justify-center items-center">
      <section style="box-shadow: 0 8px 40px rgba(40, 35, 89, 0.12);"
        class="bg-white rounded-[2rem] p-10 flex flex-col gap-[15px] w-full max-w-[450px] border border-gray-50 h-[445px]">

        <h3 class="text-[18px] font-bold text-[#3d3a7a]">New ride request!</h3>

        <div class="flex justify-between">
          <div style="display:flex; align-items:center; gap:5px;">
            <div style="width:32px; height:32px; border-radius:8px; border:1px solid #f3f3f3; display:flex; align-items:center; justify-content:center;">
              <svg style="width:14px; fill:#3d3a7a;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                <path d="M338.8-9.9c11.9 8.6 16.3 24.2 10.9 37.8L271.3 224 416 224c13.5 0 25.5 8.4 30.1 21.1s.7 26.9-9.6 35.5l-288 240c-11.3 9.4-27.4 9.9-39.3 1.3s-16.3-24.2-10.9-37.8L176.7 288 32 288c-13.5 0-25.5-8.4-30.1-21.1s-.7-26.9 9.6-35.5l288-240c11.3-9.4 27.4-9.9 39.3-1.3z" />
              </svg>
            </div>
            <div style="width:32px; height:32px; border-radius:8px; border:1px solid #f3f3f3; display:flex; align-items:center; justify-content:center;">
              <svg style="width:14px; fill:#3d3a7a;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                <path d="M160.5-26.4c9.3-7.8 23-7.5 31.9 .9 12.3 11.6 23.3 24.4 33.9 37.4 13.5 16.5 29.7 38.3 45.3 64.2 5.2-6.8 10-12.8 14.2-17.9 1.1-1.3 2.2-2.7 3.3-4.1 7.9-9.8 17.7-22.1 30.8-22.1 13.4 0 22.8 11.9 30.8 22.1 1.3 1.7 2.6 3.3 3.9 4.8 10.3 12.4 24 30.3 37.7 52.4 27.2 43.9 55.6 106.4 55.6 176.6 0 123.7-100.3 224-224 224S0 411.7 0 288c0-91.1 41.1-170 80.5-225 19.9-27.7 39.7-49.9 54.6-65.1 8.2-8.4 16.5-16.7 25.5-24.2z" />
              </svg>
            </div>
          </div>
          <div class="flex items-center ml-5">
            <div>
              <h3 class="text-[#3d3a7a] font-bold text-base">Jeck, N.</h3>
              <p class="text-[#343172] text-[12px]">158 ratings</p>
            </div>
            <img src="images/man-black.png" alt="" class="w-10 h-[55px] object-cover ml-2 rounded-[10px]" />
          </div>
        </div>

        <div class="flex justify-between items-center rounded-[10px] px-5 py-[10px]">
          <div>
            <h6 class="font-bold text-[18px] text-[#eb5b95]">25 May, 2019</h6>
            <p class="text-[#eb5b95]/40 text-[15px]">1 seat</p>
          </div>
          <div class="flex items-center whitespace-nowrap">
            <h2 class="text-[25px] font-bold text-[#eb5b95]">50 $</h2>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex">
            <div class="flex flex-col items-center justify-between h-30 w-12">
              <div class="w-6 h-8 bg-[#a3a3e3] rounded-[8px] flex items-center justify-center">
                <div class="w-2 h-2 bg-white rounded-full"></div>
              </div>
              <div class="border-l-2 border-dashed border-gray-200 h-10 my-2"></div>
              <div class="w-6 h-8 bg-[#f0edff] rounded-[8px] flex items-center justify-center">
                <div class="w-2 h-2 bg-[#847dd1] rounded-full"></div>
              </div>
            </div>
            <div class="mr-[75px]">
              <h3 class="text-[#3d3a7a] font-bold text-base">Chicago</h3>
              <p class="text-[12px] font-semibold text-[#cecdd4] py-5">Distance 15,8 km</p>
              <h3 class="text-[#3d3a7a] font-bold text-base">Oak Park</h3>
            </div>
          </div>
          <div class="flex flex-col justify-between h-[108px]">
            <h4 class="text-[15px] font-semibold text-[#cecdd4]">20:00</h4>
            <h4 class="text-[15px] font-semibold text-[#cecdd4]">22:30</h4>
          </div>
        </div>

        <div class="flex flex-row items-center justify-end gap-4 ml-28">
          <div class="flex gap-5 items-center">
            <button type="button" id="btn-decline"
              class="bg-transparent text-[#eb5b95] font-semibold text-sm border-none cursor-pointer transition-transform hover:scale-[1.04]">Decline</button>
            <button type="button" id="btn-accept"
              class="bg-blue-700 text-white w-[80px] h-[90px] rounded-[20px] text-base font-semibold shadow-xl border-none cursor-pointer transition-transform hover:scale-[1.04] mb-[10px]">Accept</button>
          </div>
        </div>

      </section>
    </div>
    
    <div id="empty-panel" class="w-full mb-4 flex justify-center items-center min-h-[200px] px-4 py-6" hidden>
      <p id="empty-message" class="text-[18px] font-semibold text-[#3d3a7a] text-center leading-relaxed max-w-[280px]"></p>
    </div>
  </main>

  <script src="js/script.js" defer></script>
</body>
</html>
